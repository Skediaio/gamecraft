name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # mesa-vulkan-drivers gives the renderer tests a software Vulkan adapter (lavapipe);
      # without it wgpu falls back to GL on llvmpipe, which rejects the shaders.
      - name: Software Vulkan adapter (wgpu)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # fmt, clippy, tests, the layer check and the wasm check, in that order.
      - run: cargo xtask ci
        env:
          # Tests that need a GPU fail instead of skipping when no adapter exists.
          GAMECRAFT_REQUIRE_GPU: 1

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
