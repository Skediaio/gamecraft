name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # mesa-vulkan-drivers gives the renderer tests a software Vulkan adapter (lavapipe);
      # without it wgpu falls back to GL on llvmpipe, which rejects the shaders.
      - name: Software Vulkan adapter (wgpu)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # fmt, clippy, tests, the layer check and the wasm check, in that order.
      - run: cargo xtask ci
        env:
          # Tests that need a GPU fail instead of skipping when no adapter exists.
          GAMECRAFT_REQUIRE_GPU: 1

  # The determinism scenarios natively and as WebAssembly in Node, every hash compared
  # (docs/architecture.md, Determinism).
  wasm-hash:
    runs-on: ubuntu-latest
    env:
      # The CLI must be the version of the `wasm-bindgen` crate the workspace pins.
      WASM_BINDGEN_VERSION: 0.2.129
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Cache the wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-${{ runner.os }}
      - name: Install the wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root ~/.wasm-bindgen
      - run: echo "$HOME/.wasm-bindgen/bin" >> "$GITHUB_PATH"
      - run: cargo xtask wasm-hash

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
