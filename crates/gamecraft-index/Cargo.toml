[package]
name = "gamecraft-index"
description = "The derived, throw-away SQL index of a project (Turso), for queries across every layer and pack. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gamecraft-world = { workspace = true }
gamecraft-project = { workspace = true }
serde_json = { workspace = true }

# Turso without its default features: no full-text search engine (tantivy), no C allocator
# (mimalloc). What an embedded local database needs is all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
turso = { workspace = true, default-features = false }
