[package]
name = "gamecraft-render"
description = "Draws a GameCraft world with VisionCraft's wgpu renderer. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gamecraft-math = { workspace = true }
gamecraft-world = { workspace = true }
# Opens glTF files safely and checks their accessors (`model.rs`).
gamecraft-project = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }
visioncraft-render = { workspace = true }
visioncraft-flora = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
png = { workspace = true }

# Blocks on wgpu's futures in the native entry points (`headless_gpu`, `WorldRenderer::render`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[dev-dependencies]
# The GLB documents a test reads and builds for the texture store (tests/models.rs).
serde_json = { workspace = true }
