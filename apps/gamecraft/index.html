<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameCraft</title>
  <link rel="icon" href="data:,">
  <!-- The window's binary built for wasm32 (README.md); the page starts it once WebGPU is checked. -->
  <link data-trunk rel="rust" data-bin="gamecraft" data-wasm-opt="z" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1219; font-family: system-ui, sans-serif; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #gc-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; color: #e8edf3; z-index: 10; }
    #gc-status[hidden] { display: none; }
    #gc-card { max-width: 560px; background: rgba(20, 26, 36, .95); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 20px 24px; line-height: 1.5; font-size: 15px; }
    #gc-card h1 { font-size: 19px; margin: 0 0 8px; }
    #gc-card ul { margin: 6px 0 10px; padding-left: 20px; }
    #gc-card small { display: block; margin-top: 10px; color: #8d99a8; word-break: break-word; font-family: ui-monospace, monospace; font-size: 12px; }
    #gc-card code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
    #gc-keys { position: absolute; left: 12px; bottom: 10px; color: rgba(255,255,255,.75); font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="gamecraft_canvas" tabindex="0"></canvas>
  <div id="gc-status"><div id="gc-card"><h1>Loading GameCraft…</h1></div></div>
  <div id="gc-keys">Click to look around · W A S D walk · Shift run · Space jump · E interact · click fire · hold Alt free look · F1 view · F5 restart · P pause · Esc frees the mouse</div>
  <script>
    // All texts together so they can be translated.
    const T = {
      starting: "Starting GameCraft…",
      noGpuTitle: "GameCraft needs WebGPU, and this browser does not offer it",
      noAdapter: "WebGPU is present but no graphics adapter is available.",
      noApi: "This browser has no WebGPU (navigator.gpu is missing).",
      lostTitle: "The graphics device was lost",
      lostHelp: "The GPU driver reset or the tab was suspended for too long. Reload the page.",
      help: [
        "Chrome, Edge and Brave on Windows, macOS, ChromeOS and Android work out of the box when up to date.",
        "Linux (Chrome, Edge, Brave, Chromium): open <code>chrome://flags/#enable-unsafe-webgpu</code> and <code>chrome://flags/#enable-vulkan</code> and enable both (also <code>#ignore-gpu-blocklist</code> if your GPU is blocklisted), restart the browser, and check <code>chrome://gpu</code> for WebGPU: Hardware accelerated.",
        "Firefox and Safari: WebGPU support depends on the version. If it fails, use a Chromium-based browser.",
      ],
      desktop: "The desktop version of GameCraft does not need a browser.",
    };
    // Alt is free look (held, the head turns and the aim stays): the browser must not take it
    // (focusing the menu bar, or a shortcut with the next key).
    for (const type of ['keydown', 'keyup']) {
      window.addEventListener(type, e => { if (e.key === 'Alt' || e.code === 'AltLeft') e.preventDefault(); }, { capture: true });
    }
    const card = document.getElementById('gc-card');
    const status = document.getElementById('gc-status');
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    // Called by the wasm (src/web.rs): an error card, and hiding the card once frames run.
    window.gcFail = (title, detail) => {
      window.__gcFailed = true;
      status.hidden = false;
      card.innerHTML = `<h1>${esc(title)}</h1><ul>${T.help.map(h => `<li>${h}</li>`).join('')}</ul><p>${esc(T.desktop)}</p>` +
        (detail ? `<small>${esc(detail)}</small>` : '');
      console.error(`${title}: ${detail}`);
    };
    window.gcHide = () => { status.hidden = true; document.getElementById('gamecraft_canvas').focus(); };
    // Resolves when WebGPU is usable; the wasm waits for it before asking for a device.
    window.__gcReady = (async () => {
      if (!navigator.gpu) { window.gcFail(T.noGpuTitle, T.noApi); throw new Error(T.noApi); }
      let adapter = null, err = '';
      try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { err = String(e); }
      if (!adapter) { window.gcFail(T.noGpuTitle, T.noAdapter + (err ? ' ' + err : '')); throw new Error(T.noAdapter); }
      // Report a lost device later, whoever created it.
      const proto = Object.getPrototypeOf(adapter);
      const original = proto.requestDevice;
      proto.requestDevice = async function (...args) {
        const device = await original.apply(this, args);
        device.lost.then(info => { if (info.reason !== 'destroyed') window.gcFail(T.lostTitle, T.lostHelp + ' ' + (info.message || '')); });
        return device;
      };
      card.innerHTML = `<h1>${esc(T.starting)}</h1>`;
      return true;
    })();
    window.__gcReady.catch(() => {});
  </script>
</body>
</html>
