# cargo-deny configuration. Run: cargo deny check

[graph]
# The engine ships to wasm32 and desktop; check what both build, not only the host.
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[advisories]
# Advisories are reported, never silenced here. Add an `ignore` entry only with a reason.
unmaintained = "workspace"
yanked = "warn"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# Workspace crates are publish = false.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# VisionCraft's renderer and plant generator (MIT).
allow-git = ["https://github.com/Skediaio/visioncraft"]
